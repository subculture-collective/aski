name: aski
services:
  web:
    image: ${ASKI_WEB_IMAGE:?immutable web image required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["${ASKI_BIND_IP:?edge-only bind required}:${ASKI_HTTP_PORT:?reserved port required}:8080"]
    networks: [edge, private]
    tmpfs: [/tmp]
  api:
    image: ${ASKI_API_IMAGE:?immutable Node 24 API image required}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ["${ASKI_ENV_FILE:?private runtime configuration required}"]
    volumes: ["${ASKI_ARTIFACT_ROOT:?private artifact root required}:/data/artifacts"]
    networks: [private, egress]
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: ${ASKI_PG_IMAGE:?immutable PostgreSQL 17 image required}
    environment:
      POSTGRES_DB: aski
      POSTGRES_USER: aski
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["${ASKI_DATABASE_ROOT:?private database root required}:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U aski -d aski"]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  edge: {}
  egress: {}
  private:
    internal: true
secrets:
  postgres_password:
    file: ${ASKI_PG_PASSWORD_FILE:?private database credential required}
