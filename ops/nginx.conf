# Static gateway for the aski web image: the studio at /, the about page at /about/. It runs as UID 101
# on a read-only root filesystem, so the pid file and temporary paths live in /tmp. /api/ goes to the
# account API container "api" on the same Compose network. When that container does not exist or does not
# answer, /api/ returns 503 and the studio hides sign-in.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;
  sendfile on;
  absolute_redirect off;
  gzip on;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
  # Almaz is the only peer admitted to this port; the client address is the last X-Forwarded-For entry it adds.
  set_real_ip_from 10.0.0.200;
  real_ip_header X-Forwarded-For;
  # Lettering and designs stay in the browser; nothing here needs third-party origins.
  map $uri $aski_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/ "no-store";
    default "no-cache";
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $aski_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /api/ {
      # The API is looked up per request, so this image also starts where no API runs (for example in CI).
      resolver 127.0.0.11 valid=10s ipv6=off;
      resolver_timeout 2s;
      set $api http://api:4181;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # The API trusts X-Real-IP only from this gateway; it carries the address Almaz saw.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      # Image files may be up to 32 MiB.
      client_max_body_size 33m;
      client_body_buffer_size 1m;
      proxy_hide_header Content-Security-Policy-Report-Only;
      error_page 502 504 = @accounts_unavailable;
      proxy_intercept_errors off;
    }
    location @accounts_unavailable { default_type application/json; add_header Cache-Control no-store always; return 503 '{"message":"Accounts are not available yet."}'; }
    location = /about { return 301 /about/; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
