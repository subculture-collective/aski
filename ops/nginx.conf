# Static gateway for the aski web image: the studio at /, the about page at /about/. It runs as UID 101
# on a read-only root filesystem, so the pid file and temporary paths live in /tmp. Until the account
# API is deployed, /api/ answers 503 and the studio hides sign-in.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  access_log off;
  server_tokens off;
  sendfile on;
  absolute_redirect off;
  gzip on;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
  # Lettering and designs stay in the browser; nothing here needs third-party origins.
  map $uri $aski_cache {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $aski_cache always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /api/ { default_type application/json; return 503 '{"message":"Accounts are not available yet."}'; }
    location = /about { return 301 /about/; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
