name: Mirror

# github.com/subculture-collective/aski is canonical. Every branch and tag is copied to the Gitea
# repository; branches deleted here are deleted there too. The personal copy (onnwee/aski) is kept
# current by Kvant's github-canonical-mirror timer, not by this workflow.
on:
  push:
  delete:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  mirror:
    if: github.repository == 'subculture-collective/aski'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GITEA_TOKEN: ${{ secrets.GITEA_MIRROR_TOKEN }}
    steps:
      - name: Fetch every branch and tag
        run: |
          git init -q --bare repo.git
          cd repo.git
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch -q --prune "https://github.com/$GITHUB_REPOSITORY.git" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          git config --unset http.https://github.com/.extraheader
      - name: Push to Gitea
        working-directory: repo.git
        run: |
          git -c http.https://git.subcult.tv/.extraheader="AUTHORIZATION: basic $(printf 'github-mirror:%s' "$GITEA_TOKEN" | base64 -w0)" \
            push --prune https://git.subcult.tv/subculture-collective/aski.git '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
