name: Debug WebKit pause
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAPI_RS_FORCE_WASI: 'error'
      NAPI_RS_ENFORCE_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/zz-debug.spec.ts tests/animation.spec.ts --project=webkit --reporter=line --trace=on || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: test-results, retention-days: 3 }
