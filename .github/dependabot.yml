version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Must match the rolldown version that vite locks; see docs/ci-runtime.md.
      - dependency-name: '@rolldown/binding-wasm32-wasi'
  - package-ecosystem: npm
    directory: /research/browser-probe
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      browser-probe-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /research/font-audit
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      font-audit-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
